name: Build Voice Changer APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: VoiceChangerAnime
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChanger-debug-apk
          path: VoiceChangerAnime/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error        with:
          gradle-version: '8.9'

      -  name: Build APK
  run: |
    PROJECT_DIR=$(dirname "$(find . -name settings.gradle.kts -o -name settings.gradle | head -n 1)")
    echo "Project directory: $PROJECT_DIR"
    cd "$PROJECT_DIR"
    gradle --no-daemon assembleDebug

      - name: Upload APK
  uses: actions/upload-artifact@v4
  with:
    name: VoiceChanger-debug-apk
    path: "**/app/build/outputs/apk/debug/app-debug.apk"
    if-no-files-found: error
